name: Build DreamSave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build DreamSave
        working-directory: DreamSave-v2.0-project/DreamSave
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Looking for APK..."
          find . -type f -name "*.apk"

      - name: Upload DreamSave APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamSave-v2.0-APK
          path: DreamSave-v2.0-project/DreamSave/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
