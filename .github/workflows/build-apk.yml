name: Build DreamSave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check DreamSave project
        working-directory: DreamSave-v2.0-project/DreamSave
        run: |
          echo "Project contents:"
          ls -la
          echo "Checking Gradle files..."
          find . -maxdepth 2 -type f | sort

      - name: Build DreamSave APK
        working-directory: DreamSave-v2.0-project/DreamSave
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files found:"
          find . -type f -name "*.apk" -print

      - name: Upload DreamSave APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamSave-v2.0-APK
          path: DreamSave-v2.0-project/DreamSave/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
