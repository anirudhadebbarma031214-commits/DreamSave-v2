name: Build DreamSave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Gradle project
        run: |
          echo "Searching for gradlew..."
          find . -type f -name "gradlew" -print

      - name: Build APK
        run: |
          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found!"
            echo "Project files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found Gradle wrapper at: $GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamSave-v2.0-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
